name: Android release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build signed release APK
        env:
          PB_KEYSTORE: ${{ runner.temp }}/release.keystore
          PB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease
      - name: Check the APK has its manifest
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -q AndroidManifest.xml
      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "pendelbuddy-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: pendelbuddy-${{ github.ref_name }}.apk
          generate_release_notes: true
